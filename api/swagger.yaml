  /api/v1/files:
    delete:
      parameters:
      - description: 文件路径
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Result'
      summary: 删除文件
      tags:
      - 10.文件接口
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 文件
        in: formData
        name: file
        required: true
        type: file
      - description: 存储路径前缀
        in: formData
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Result'
            - properties:
                data:
                  $ref: '#/definitions/handler.UploadResult'
              type: object
      summary: 文件上传
      tags:
      - 10.文件接口
  /api/v1/files/batch:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 文件列表
        in: formData
        name: files
        required: true
        type: file
      - description: 存储路径前缀
        in: formData
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Result'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.UploadResult'
                  type: array
              type: object
      summary: 批量文件上传
      tags:
      - 10.文件接口
  /api/v1/files/image:
    post:
