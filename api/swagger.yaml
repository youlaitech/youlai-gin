definitions:
  common.Result:
    properties:
      code:
        type: string
      data: {}
      msg:
        type: string
    type: object
  handler.UploadResult:
    properties:
      name:
        description: 原始文件名
        type: string
      path:
        description: 存储路径
        type: string
      size:
        description: 文件大小
        type: integer
      url:
        description: 访问URL
        type: string
    type: object
  model.KeyValue:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  model.LoginRequest:
    properties:
      captchaCode:
        description: 验证码
        example: "1234"
        type: string
      captchaId:
        description: 验证码缓存 ID
        example: captcha_id_123
        type: string
      password:
        description: 密码
        example: "123456"
        type: string
      username:
        description: 用户名
        example: admin
        type: string
    required:
    - captchaCode
    - captchaId
    - password
    - username
    type: object
  model.MenuForm:
    properties:
      alwaysShow:
        description: 始终显示
        type: integer
      component:
        description: 前端组件
        type: string
      icon:
        description: 图标
        type: string
      id:
        description: 主键
        type: integer
      keepAlive:
        description: 页面缓存
        type: integer
      name:
        description: 名称
        type: string
      params:
        description: 路由参数
        items:
          $ref: '#/definitions/model.KeyValue'
        type: array
      parentId:
        description: 父级ID
        type: integer
      perm:
        description: 权限标识
        type: string
      redirect:
        description: 重定向
        type: string
      routeName:
        description: 路由名称
        type: string
      routePath:
        description: 路由路径
        type: string
      sort:
        description: 排序
        type: integer
      type:
        description: 类型(C目录/M菜单/B按钮)
        enum:
        - C
        - M
        - B
        type: string
      visible:
        description: 是否可见
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    - type
    type: object
  model.RoleForm:
    properties:
      code:
        description: 编码
        type: string
      dataScope:
        description: 数据权限范围
        enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        type: integer
      deptIds:
        description: 部门ID列表
        items:
          type: integer
        type: array
      id:
        description: 主键
        type: integer
      name:
        description: 名称
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态(1启用0禁用)
        enum:
        - 0
        - 1
        type: integer
    required:
    - code
    - name
    type: object
  model.SmsLoginRequest:
    properties:
      code:
        description: 验证码
        example: "1234"
        type: string
      mobile:
        description: 手机号
        example: "18888888888"
        type: string
    required:
    - code
    - mobile
    type: object
  model.WxMaBindMobileRequest:
    properties:
      mobile:
        description: 手机号
        example: "18888888888"
        type: string
      openId:
        description: 微信openid
        example: xxx
        type: string
      smsCode:
        description: 短信验证码
        example: "1234"
        type: string
    required:
    - mobile
    - openId
    - smsCode
    type: object
  model.WxMaPhoneLoginRequest:
    properties:
      loginCode:
        description: 微信登录code
        example: xxx
        type: string
      phoneCode:
        description: 微信手机号code
        example: xxx
        type: string
    required:
    - loginCode
    - phoneCode
    type: object
  model.WxMaSilentLoginRequest:
    properties:
      code:
        description: 微信登录code
        example: xxx
        type: string
    required:
    - code
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/captcha:
    get:
      description: 获取图形验证码
      produces:
      - application/json
      responses:
        "200":
          description: code/msg/data，data 为 CaptchaVO
          schema:
            additionalProperties: true
            type: object
      summary: 获取验证码
      tags:
      - 01.认证中心
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 用户名密码登录，返回访问令牌和刷新令牌
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code/msg/data，data 为 AuthenticationToken
          schema:
            additionalProperties: true
            type: object
      summary: 账号密码登录
      tags:
      - 01.认证中心
  /api/v1/auth/login/sms:
    post:
      consumes:
      - application/json
      description: 使用手机号和短信验证码登录
      parameters:
      - description: 短信登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.SmsLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: code/msg/data，data 为 AuthenticationToken
          schema:
            additionalProperties: true
            type: object
      summary: 短信验证码登录
      tags:
      - 01.认证中心
  /api/v1/auth/logout:
    delete:
      consumes:
      - application/json
      description: 使当前访问令牌失效
      produces:
      - application/json
      responses:
        "200":
          description: code/msg
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: 退出登录
      tags:
      - 01.认证中心
  /api/v1/auth/refresh-token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 使用刷新令牌获取新的访问令牌
      parameters:
      - description: 刷新令牌
        in: formData
        name: refreshToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: code/msg/data，data 为 AuthenticationToken
          schema:
            additionalProperties: true
            type: object
      summary: 刷新令牌
      tags:
      - 01.认证中心
  /api/v1/auth/sms/code:
    post:
      consumes:
      - application/json
      description: 发送短信验证码到指定手机号
      parameters:
      - description: 手机号信息 {\
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: code/msg
          schema:
            additionalProperties: true
            type: object
      summary: 发送登录短信验证码
      tags:
      - 01.认证中心
  /api/v1/codegen/{tableName}/config:
