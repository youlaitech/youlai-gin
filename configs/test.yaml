# 测试环境配置 (test.yaml)
# 任何配置项可用环境变量覆盖：APP_<模块>_<字段>（如 APP_DATABASE_PASSWORD、APP_REDIS_HOST）

# 服务配置
server:
  port: 8000

# 数据库配置
database:
  host: www.youlai.tech
  port: 3306
  username: youlai
  password: 123456
  dbname: youlai_admin # 数据库名称
  charset: utf8mb4 # 字符集（支持 emoji）
  parseTime: true # 自动解析时间类型
  loc: Local # 时区设置

  # 连接池配置
  maxIdleConns: 10 # 最大空闲连接数
  maxOpenConns: 100 # 最大打开连接数
  connMaxLifetime: 3600 # 连接最大存活时间（秒）

# Redis 配置
redis:
  host: www.youlai.tech
  port: 6379
  password: 123456
  database: 4 # Redis 数据库编号（0-15）

  # 连接池配置
  pool:
    maxIdle: 10 # 最大空闲连接数
    maxActive: 100 # 最大活动连接数
    minIdle: 5 # 最小空闲连接数

  # 超时配置（秒）
  timeout:
    dial: 5 # 建立连接超时
    read: 3 # 读取超时
    write: 3 # 写入超时
    pool: 5 # 连接池获取连接超时

# 日志配置
logger:
  level: debug # 日志级别：debug/info/warn/error（开发用 debug）

  # 控制台输出配置
  console:
    enabled: true # 是否启用控制台输出
    color: true # 是否启用彩色输出（开发建议启用）
    format: text # 输出格式：text（易读）/ json（机器解析）

  # 文件输出配置
  file:
    enabled: true # 是否启用文件输出
    path: logs/dev.log # 日志文件路径
    maxSize: 100 # 单个文件最大大小（MB）
    maxBackups: 7 # 保留的旧日志文件个数
    maxAge: 7 # 保留的最大天数
    compress: false # 是否压缩旧日志（开发环境不压缩，便于查看）
    format: json # 文件格式（json 便于后续分析）
    errorPath: logs/dev-error.log # 错误日志单独文件

# 安全配置
security:
  sessionType: jwt # 会话类型：jwt（无状态）/ redis-token（有状态）

  # JWT 配置（无状态会话）
  jwt:
    secretKey: "SecretKey012345678901234567890123456789012345678901234567890123456789" # JWT密钥(HS256算法至少32字符)
    accessTokenTTL: 7200 # 访问令牌有效期（秒，2小时）
    refreshTokenTTL: 2592000 # 刷新令牌有效期（秒，30天）
    enableSecurityVersion: true # 是否启用安全版本号（密码修改后使旧 Token 失效）

  # Redis Token 配置（有状态会话）
  redisToken:
    accessTokenTTL: 7200 # 访问令牌有效期（秒）
    refreshTokenTTL: 2592000 # 刷新令牌有效期（秒）
    allowMultiLogin: true # 是否允许多设备同时登录（开发环境允许）

# 微信小程序配置
wechat:
  miniapp:
    appId: Your_AppId
    appSecret: Your_AppSecret

# 文件存储
storage:
  # 存储类型：s3 | local
  type: s3
  # 上传限制
  upload:
    max-file-size: 50MB
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
  # S3（RustFS）对象存储（测试环境实际地址通过部署环境覆盖）
  s3:
    endpoint: http://127.0.0.1:9000
    access-key: rustfs-admin
    secret-key: rustfs-admin
    bucket: public
    domain:
    path-no-bucket-name: false
  # 本地存储
  local:
    path: ./uploads
    base-url: /files

# 接口限流
rate-limit:
  default-limit: 60
  default-window: 60s
  ip:
    enabled: true
    limit: 1000
    window: 60s

# AI 对话（OpenAI 兼容协议，默认关闭；动态表单/菜单的 AI 辅助接口依赖它）
ai:
  enabled: false
  baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
  apiKey: ""
  model: qwen-plus
